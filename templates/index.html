<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nifty 1M Pattern Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .signal { font-size: 24px; font-weight: bold; margin: 20px 0; color: #00ffcc; }
        .price { font-size: 20px; color: #ffcc00; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nifty 1-Minute Pattern Terminal</h1>
        <div class="price">Spot Price: ₹{{ spot_price }} ({{ price_change_formatted }} | {{ price_change_pct_formatted }})</div>
        <div class="signal">Signal: {{ signal_type }}</div>
        <p>Last Updated: {{ current_time }}</p>
    </div>
</body>
</html>
